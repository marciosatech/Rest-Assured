name: Testes Automatizados - Rest Assured

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write  # necessário para publicar o relatório na branch gh-pages

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Faz o download do código do repositório para o runner
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2. Configura a versão do Java JDK
      - name: Configurar o Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # 3. Gera o environment.properties dinamicamente com os dados reais do runner
      - name: Gerar environment.properties
        run: |
          mkdir -p src/test/resources
          echo "OS=$(uname -a)" > src/test/resources/environment.properties
          echo "Java.Version=$(java -version 2>&1 | head -n 1)" >> src/test/resources/environment.properties
          echo "Browser=N/A (API tests)" >> src/test/resources/environment.properties
          echo "URL=https://restful-booker.herokuapp.com" >> src/test/resources/environment.properties
          echo "Executor=GitHub Actions" >> src/test/resources/environment.properties

      # 4. Executa os testes (não trava o build mesmo com falhas, graças ao testFailureIgnore)
      - name: Executar testes com Maven
        run: mvn clean test

      # 5. Publica um resumo visual dos testes (passou/falhou) no Job Summary do GitHub Actions
      - name: Publicar resumo dos testes
        if: always()
        run: |
          TESTS=0; FAILURES=0; ERRORS=0; SKIPPED=0

          for f in target/surefire-reports/*.xml; do
            [ -e "$f" ] || continue
            T=$(grep -oP 'tests="\K[0-9]+' "$f" | head -1)
            FA=$(grep -oP 'failures="\K[0-9]+' "$f" | head -1)
            ER=$(grep -oP 'errors="\K[0-9]+' "$f" | head -1)
            SK=$(grep -oP 'skipped="\K[0-9]+' "$f" | head -1)
            TESTS=$((TESTS + ${T:-0}))
            FAILURES=$((FAILURES + ${FA:-0}))
            ERRORS=$((ERRORS + ${ER:-0}))
            SKIPPED=$((SKIPPED + ${SK:-0}))
          done

          PASSED=$((TESTS - FAILURES - ERRORS - SKIPPED))

          if [ "$TESTS" -gt 0 ]; then
            PERCENT=$(( PASSED * 100 / TESTS ))
          else
            PERCENT=0
          fi

          if [ "$FAILURES" -eq 0 ] && [ "$ERRORS" -eq 0 ]; then
            STATUS_EMOJI="🟢"
            STATUS_TEXT="Todos os testes passaram"
          else
            STATUS_EMOJI="🔴"
            STATUS_TEXT="Existem testes falhando"
          fi

          {
            echo "## ${STATUS_EMOJI} Resultado dos Testes — ${STATUS_TEXT}"
            echo ""
            echo "**${PASSED}/${TESTS} testes passaram (${PERCENT}%)**"
            echo ""
            echo "| Status | Quantidade |"
            echo "|---|---:|"
            echo "| ✅ Passou | ${PASSED} |"
            echo "| ❌ Falhou | ${FAILURES} |"
            echo "| 🔥 Erro | ${ERRORS} |"
            echo "| ⏭️ Pulado | ${SKIPPED} |"
            echo "| 📊 Total | ${TESTS} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$FAILURES" -gt 0 ] || [ "$ERRORS" -gt 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### ❌ Testes que falharam" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            for f in target/surefire-reports/*.xml; do
              [ -e "$f" ] || continue
              awk '
                /<testcase / { name=""; classname=""; failing=0 }
                /classname="/ { match($0, /classname="[^"]*"/); classname=substr($0, RSTART+11, RLENGTH-12) }
                /name="/ { match($0, /name="[^"]*"/); name=substr($0, RSTART+6, RLENGTH-7) }
                /<failure|<error/ { failing=1 }
                /<\/testcase>/ { if (failing) print "- `" classname "." name "`" }
              ' "$f" >> "$GITHUB_STEP_SUMMARY"
            done
          fi

      # 6. Busca o histórico das execuções anteriores (fica salvo na branch gh-pages)
      - name: Carregar histórico do Allure
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Copiar histórico anterior para os resultados atuais
        if: always()
        run: |
          mkdir -p target/allure-results/history
          if [ -d "gh-pages/history" ]; then
            cp -r gh-pages/history/* target/allure-results/history/ || true
          fi

      # 7. Gera o relatório HTML já com o histórico incluído
      - name: Gerar relatório Allure
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: target/allure-results
          allure_history: allure-history
          keep_reports: 20

      # 7.1 Remove metadados git residuais que ficam dentro de allure-history
      - name: Limpar .git residual do histórico
        if: always()
        run: sudo rm -rf allure-history/.git

      # 8. Publica o relatório (com o novo histórico) na branch gh-pages
      - name: Publicar relatório no GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          force_orphan: true

      # 9. Adiciona o link direto do relatório desta execução no Job Summary
      - name: Publicar link do relatório Allure
        if: always()
        run: |
          REPORT_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.run_number }}/index.html"
          {
            echo ""
            echo "---"
            echo "📄 **[Abrir relatório completo do Allure](${REPORT_URL})**"
          } >> "$GITHUB_STEP_SUMMARY"
